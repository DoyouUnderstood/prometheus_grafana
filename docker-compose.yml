services:
  nginx:
    image: nginx:latest
    container_name: nginx_proxy
    working_dir: /frontend/
    restart: always
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf
      - ./frontend:/frontend/
    ports:
      - "8080:8080"
    networks:
      - monitoring_network
 
  fastify:
    build: ./backend
    container_name: fastify_backend
    restart: always
    ports:
      - "3000:3000"
    networks:
      - monitoring_network

  node_exporter:
    image: prom/node-exporter
    container_name: node_exporter
    restart: always
    networks:
      - monitoring_network
    ports:
      - "9100:9100"
  nginx_exporter:
    image: nginx/nginx-prometheus-exporter
    container_name: nginx_exporter
    restart: always
    command: -nginx.scrape-uri=http://nginx_proxy:8080/basic_status
    networks:
      - monitoring_network
    depends_on:
      - nginx

  prometheus:
    image: prom/prometheus
    container_name: prometheus
    restart: always
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml
    networks:
      - monitoring_network
  
  grafana:
    image: grafana/grafana
    container_name: grafana
    restart: always
    volumes:
      - grafana_data:/var/lib/grafana
    networks: 
      - monitoring_network
    environment:
      - GF_SERVER_ROOT_URL=http://localhost:8080/grafana/
      - GF_SERVER_SERVE_FROM_SUB_PATH=true

networks:
  monitoring_network:
    name: monitoring_network

volumes:
  grafana_data:
